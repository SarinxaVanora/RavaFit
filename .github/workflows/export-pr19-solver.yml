name: Export PR19 Solver Source

on:
  push:
    branches:
      - tmp/export-pr19-solver

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: false
      - name: Package exact solver source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          cp -a runtime export/runtime
          printf '%s\n' "$GITHUB_SHA" > export/SOURCE_COMMIT.txt
          tar -czf pr19-ravafit-solver-source.tar.gz -C export .
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v6
        with:
          name: pr19-ravafit-solver-source
          path: pr19-ravafit-solver-source.tar.gz
          if-no-files-found: error
          retention-days: 1
