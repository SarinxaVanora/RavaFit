name: Solver Unit Tests

on:
  pull_request:
    paths:
      - "runtime/solver/**"
      - ".github/workflows/solver-unit-tests.yml"
  push:
    branches:
      - master
    paths:
      - "runtime/solver/**"
      - ".github/workflows/solver-unit-tests.yml"

permissions:
  contents: read

jobs:
  focused-solver-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pytest

      - name: Run motion-skinning, target-fit, core-fit, strict-B14 and final-occupancy regressions
        working-directory: runtime/solver
        run: python -m pytest -q test_adaptive_skinning.py test_local_support_preserve.py test_target_fit_authority.py test_core_fit_authority.py test_core_fit_entrypoint.py test_strict_fit_authority.py test_final_occupancy_guard.py

      - name: Verify isolated SolverHost bootstrap
        working-directory: runtime/solver
        run: python -I server.py </dev/null
