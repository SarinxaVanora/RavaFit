name: Export Current Solver Source

on:
  push:
    branches:
      - tmp/export-current-solver

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hydrated distribution
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: true
      - name: Verify published runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f distribution/assets/RavaFit.Runtime.win-x64.1.1.9.zip
          sha256sum distribution/assets/RavaFit.Runtime.win-x64.1.1.9.zip
          test "$(sha256sum distribution/assets/RavaFit.Runtime.win-x64.1.1.9.zip | awk '{print $1}')" = "8e63944d42d6c98ef87e34541f03d985008e4e66d348e60c516e9975a2aace94"
      - name: Upload exact published runtime
        uses: actions/upload-artifact@v6
        with:
          name: current-ravafit-runtime
          path: distribution/assets/RavaFit.Runtime.win-x64.1.1.9.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
